name: Tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5        # copy your repo onto the runner
      - uses: actions/setup-python@v5    # install Python
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest
